<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Exame (Multiple Choice Model)</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon"type="image/x-icon" href="imagen/FECT.png">
    <style>
        body {
            background: #f7fafd;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .top-bar {
            background: #366e9d;
            color: #fff;
            padding: 13px 0 16px 0;
            font-size: 1.4em;
            position: relative;
        }
        .menu-icon {
            position: absolute;
            right: 14px;
            top: 13px;
            width: 38px;
            height: 38px;
            background: #366e9d;
            border: 1px solid #15547a;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-icon span {
            display: block;
            width: 23px;
            height: 3px;
            background: #fff;
            margin: 3px 0;
            border-radius: 2px;
        }
        .title {
            text-align: center;
            margin-top: 46px;
            font-size: 1.4em;
            color: #1a3d5b;
            font-weight: normal;
        }
        .login-box {
            background: #fff;
            max-width: 395px;
            margin: 32px auto 0 auto;
            padding: 24px 22px 30px 22px;
            border-radius: 6px;
            box-shadow: 0 0 10px #0001;
            border: 1px solid #b7d1ea;
        }
        .login-box label {
            display: block;
            font-weight: bold;
            margin-top: 16px;
            margin-bottom: 6px;
            font-size: 1em;
        }
        .login-box input[type="text"],
        .login-box input[type="password"] {
            width: 100%;
            padding: 12px 10px;
            border: 1px solid #b3bfd2;
            border-radius: 4px;
            font-size: 1em;
            margin-bottom: 6px;
            box-sizing: border-box;
        }
        .login-box input[type="text"]::placeholder,
        .login-box input[type="password"]::placeholder {
            color: #b1b5bc;
        }
        .login-box button {
            background: #2471bc;
            color: #fff;
            border: none;
            padding: 12px 26px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.03em;
            margin-top: 16px;
            font-weight: bold;
        }
        .login-box button:hover {
            background: #18517c;
        }
        .copyright {
            text-align: center;
            margin-top: 48px;
            background: #55585d;
            color: #fff;
            padding: 18px 8px 15px 8px;
            font-size: 1em;
        }
        @media (max-width: 480px) {
            .login-box {
                max-width: 96vw;
                padding: 18px 2vw 24px 2vw;
            }
            .top-bar {
                font-size: 1.03em;
            }
            .title {
                font-size: 1.07em;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <span> </span>
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
    <div class="title">
        Online Exame (Multiple Choice Model)
    </div>
    <form class="login-box">
        <label for="username">UserName:</label>
        <input type="text" id="username" name="username" placeholder="username" autocomplete="username">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="password" autocomplete="current-password">
        <button type="submit">Login</button>
    </form>
    <div class="copyright">
        © Copyright 2016 - 2025 | Departamento de Engenharia Informática - FECT - UNTL
    </div>
</body>
</html>
